type Question {
  id: String!
  title: String!
  type: QuestionType!
  options: [String!]
  required: Boolean!
}

enum QuestionType {
  TEXT
  DATE
  MULTIPLE_CHOICE
  CHECKBOX
}

type Form {
  id: String!
  title: String!
  description: String
  questions: [Question!]
}

type Answer {
  questionId: String!
  value: [String!]
}

type Response {
  id: ID!
  formId: ID!
  answers: [Answer!]!
  submittedAt: String!
}

type Query {
  forms: [Form!]!
  form(id: ID!): Form
  responses(formId: ID!): [Response!]!
}

type Mutation {
  createForm(input: CreateFormInput!): Form!
  submitResponse(input: SubmitResponseInput!): Response!
  deleteForm(id: ID!): Boolean!
}

input QuestionInput {
  title: String!
  type: QuestionType!
  options: [String!]
  required: Boolean!
}

input CreateFormInput {
  title: String!
  description: String
  questions: [QuestionInput!]
}

input AnswerInput {
  questionId: String!
  value: [String!]
}

input SubmitResponseInput {
  formId: ID!
  answers: [AnswerInput!]!
}
